<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary metadata -->
    <title>Roowiki — Mesh Editor for Shaders and VFX</title>
    <meta name="description" content="Roowiki is a browser-based mesh editor for creating and editing 2D and 3D shapes for shaders, VFX, and procedural workflows." />
    <meta name="application-name" content="Roowiki" />
    <meta name="author" content="Roowiki" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://roowiki.com/mesheditor/" />
    <meta property="og:site_name"   content="Roowiki" />
    <meta property="og:title"       content="Roowiki — Mesh Editor for Shaders and VFX" />
    <meta property="og:description" content="Browser-based mesh editor for creating and editing 2D and 3D shapes for shaders, VFX, and procedural workflows." />
    <meta property="og:image"       content="https://roowiki.com/mesheditor/logo.png" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Roowiki — Mesh Editor for Shaders and VFX" />
    <meta name="twitter:description" content="Browser-based mesh editor for creating and editing 2D and 3D shapes for shaders, VFX, and procedural workflows." />
    <meta name="twitter:image"       content="https://roowiki.com/mesheditor/logo.png" />

    <!-- Icons & manifest -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo-dark.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <script>
      (function() {
        var t;
        try {
          t = localStorage.getItem('roowiki-theme');
          if (!t) {
            var old = localStorage.getItem('shadermesh-theme');
            if (old === 'dark' || old === 'light') { t = old; localStorage.setItem('roowiki-theme', t); }
          }
        } catch(e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
